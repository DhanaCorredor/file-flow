[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fileflow"
version = "0.1.0"
description = "A safe, reversible CLI that organizes messy directories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dhana Corredor" }]
keywords = ["cli", "automation", "file-management", "organizer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Typing :: Typed",
]

# Zero runtime dependencies: the standard library covers every concern.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["fileflow"]

# ---------------------------------------------------------------------------
# Ruff — linter and formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort — import ordering
    "N",    # pep8-naming
    "UP",   # pyupgrade — modern syntax
    "B",    # flake8-bugbear — likely bugs
    "A",    # flake8-builtins — shadowed builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib — enforces pathlib over os.path
    "RET",  # flake8-return — early returns, no redundant else
    "ARG",  # flake8-unused-arguments
    "TID",  # flake8-tidy-imports
    "PL",   # pylint subset
    "RUF",  # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
